
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ONEXIO — Le futur commence ici</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(ellipse at 50% 38%,
          #071b42 0%, #080a14 38%, #050509 78%);
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 35px 20px;
    }

    .logo {
      width: min(75vw, 300px);
      filter:
        drop-shadow(0 0 12px #008cff)
        drop-shadow(0 0 30px #005dff);
      animation: apparition 1.2s ease-out;
    }

    .nom {
      margin: 24px 0 0;
      font-size: clamp(34px, 9vw, 54px);
      font-weight: 800;
      letter-spacing: 0.16em;
      background: linear-gradient(
        180deg, #ffffff 25%, #64d7ff 65%, #078bff 100%
      );
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 22px #007bff30;
    }

    .slogan {
      margin: 18px 0 28px;
      color: #cbd9f5;
      font-size: 16px;
      line-height: 1.6;
    }

    .bouton {
      padding: 14px 26px;
      border: 1px solid #58caff;
      border-radius: 30px;
      background: linear-gradient(135deg, #087cff, #1644d8);
      color: white;
      font-size: 16px;
      font-weight: bold;
      box-shadow: 0 0 22px #087cff65;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .bouton:active {
      transform: scale(0.96);
    }

    .message {
      display: none;
      max-width: 320px;
      margin-top: 24px;
      padding: 16px;
      border: 1px solid #164d91;
      border-radius: 14px;
      background: #0b1630;
      color: #dcecff;
      line-height: 1.6;
    }

    .message.visible {
      display: block;
    }

    footer {
      margin-top: 45px;
      color: #65718b;
      font-size: 12px;
      letter-spacing: 0.08em;
    }

    @keyframes apparition {
      from {
        opacity: 0;
        transform: scale(0.85);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }
  </style>
</head>

<body>
  <main class="page">

    <svg class="logo" viewBox="0 0 300 300"
         xmlns="http://www.w3.org/2000/svg"
         role="img" aria-label="Symbole lumineux X d'Onexio">

      <defs>
        <linearGradient id="bleu" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#ffffff"/>
          <stop offset="45%" stop-color="#37cfff"/>
          <stop offset="100%" stop-color="#006aff"/>
        </linearGradient>
      </defs>

      <circle cx="150" cy="150" r="112"
        fill="#050a1c" stroke="#087cff" stroke-width="5"/>

      <circle cx="150" cy="150" r="102"
        fill="none" stroke="#65dcff" stroke-width="2"
        opacity="0.9"/>

      <path d="M90 75 L145 139 L159 150 L145 161 L90 225
               L137 157 L145 150 L137 143 Z"
        fill="url(#bleu)"/>

      <path d="M210 75 L163 143 L155 150 L163 157 L210 225
               L165 161 L151 150 L165 139 Z"
        fill="url(#bleu)"/>

      <circle cx="150" cy="150" r="5" fill="#ffffff"/>
    </svg>

    <h1 class="nom">ONEXIO</h1>

    <p class="slogan">
      Une seule app pour la nouvelle génération.
    </p>

    <button class="bouton" id="decouvrir">
      Découvrir Onexio
    </button>

    <div class="message" id="message">
      Bienvenue dans Onexio !<br>
      Le futur commence ici. 🚀
    </div>

    <footer>
      ONEXIO · INNOVATION · AVENIR
    </footer>

  </main>

  <script>

    const bouton = document.getElementById("decouvrir");
    const message = document.getElementById("message");

    bouton.addEventListener("click", function () {
      message.classList.toggle("visible");

      if (message.classList.contains("visible")) {
        bouton.textContent = "Fermer";
      } else {
        bouton.textContent = "Découvrir Onexio";
      }
    });
  </script>
</body>
</html>
